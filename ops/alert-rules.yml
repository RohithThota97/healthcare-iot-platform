groups:
  - name: ingestion
    rules:
      - alert: KafkaConsumerLagHigh
        expr: kafka_consumer_group_lag > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Kafka consumer lag is high
          description: A consumer group has more than 10,000 unprocessed events.

      - alert: DeadLetterQueueRateHigh
        expr: rate(healthcare_dlq_messages_total[5m]) > 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Invalid event rate is elevated
          description: The DLQ is receiving more than one event per second.

  - name: data-quality
    rules:
      - alert: DeltaTableFreshnessBreach
        expr: healthcare_delta_table_age_seconds > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Curated data is stale
          description: A monitored Delta table has not been updated for one hour.

      - alert: FeatureDriftDetected
        expr: healthcare_feature_drift_score > 0.2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Feature distribution drift detected
          description: Investigate the feature, device population, and model version before promotion.